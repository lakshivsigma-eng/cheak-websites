<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --java: #f89820;
            --html: #38bdf8;
            --js: #f7df1e;
            --pink: #f472b6;
        }

        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .header { padding: 10px 20px; background: var(--panel); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        
        .mode-selector { display: flex; background: #000; padding: 4px; border-radius: 8px; gap: 5px; }
        
        .mode-btn { padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; border: none; color: #94a3b8; background: transparent; transition: 0.2s; }
        
        /* Active States */
        .mode-btn.active[onclick*="'java'"] { background: var(--java); color: black; }
        .mode-btn.active[onclick*="'html'"] { background: var(--html); color: black; }
        .mode-btn.active[onclick*="'js'"] { background: var(--js); color: black; }

        .container { display: flex; flex: 1; padding: 15px; gap: 15px; }
        
        #editor { flex: 1; background: #000; padding: 20px; border-radius: 12px; border: 1px solid #334155; outline: none; font-size: 14px; font-family: monospace; resize: none; }

        .preview-side { flex: 1; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; border: 1px solid #334155; background: #000; }
        
        #display-frame { width: 100%; height: 100%; border: none; background: white; display: none; }
        
        #console-out { flex: 1; padding: 20px; font-family: monospace; color: #10b981; overflow-y: auto; white-space: pre-wrap; }

        .label { background: #1e293b; padding: 5px 15px; font-size: 11px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="header">
    <div>SiteForge <span id="mode-text" style="color:var(--pink)">Studio</span></div>
    <div class="mode-selector">
        <button class="mode-btn active" onclick="switchMode('java')">JAVA</button>
        <button class="mode-btn" onclick="switchMode('html')">HTML5</button>
        <button class="mode-btn" onclick="switchMode('js')">JS</button>
    </div>
</div>

<div class="container">
    <textarea id="editor" spellcheck="false"></textarea>
    <div class="preview-side">
        <div class="label" id="view-label">Terminal</div>
        <div id="console-out"></div>
        <iframe id="display-frame"></iframe>
    </div>
</div>

<script>
    let mode = 'java';
    const editor = document.getElementById('editor');
    const consoleOut = document.getElementById('console-out');
    const frame = document.getElementById('display-frame');

    const codeInit = {
        java: 'public class Main {\n  public static void main(String[] args) {\n    System.out.println("Java Ready");\n  }\n}',
        html: '<h1>SiteForge</h1>\n<p>HTML Mode</p>',
        js: 'let x = 5;\nlet y = 10;\nconsole.log("Sum is: " + (x + y));'
    };

    function switchMode(m) {
        mode = m;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase().includes(m)));
        
        // Setup UI
        frame.style.display = (m === 'html') ? 'block' : 'none';
        consoleOut.style.display = (m === 'html') ? 'none' : 'block';
        editor.style.color = `var(--${m})`;
        document.getElementById('view-label').innerText = (m === 'html') ? "Browser Preview" : "Console Output";
        
        editor.value = codeInit[m];
        update();
    }

    function update() {
        const code = editor.value;
        consoleOut.innerHTML = "";

        if (mode === 'html') {
            frame.srcdoc = code;
        } else if (mode === 'java') {
            const matches = code.match(/System\.out\.println\s*\(\s*"(.*?)"\s*\);/g);
            if (matches) matches.forEach(m => {
                consoleOut.innerHTML += "> " + m.match(/"(.*?)"/)[1] + "\n";
            });
        } else if (mode === 'js') {
            try {
                // Temporary capture console.log
                const logs = [];
                const fakeLog = (msg) => logs.push("> " + msg);
                const originalLog = console.log;
                console.log = fakeLog;
                eval(code);
                console.log = originalLog;
                consoleOut.innerHTML = logs.join('\n');
            } catch (e) {
                consoleOut.innerHTML = `<span style="color:red">Error: ${e.message}</span>`;
            }
        }
    }

    editor.addEventListener('input', update);
    switchMode('java');
</script>
</body>
</html>
